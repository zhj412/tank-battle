<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坦克大战</title>
<style>
  :root {
    --bg: #1a1a2e;
    --panel: #16213e;
    --accent: #e94560;
    --gold: #f0a500;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: #eee;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    user-select: none;
  }
  .wrap { text-align: center; padding: 20px; }
  h1 {
    margin: 0 0 8px;
    letter-spacing: 6px;
    font-size: 28px;
    color: var(--gold);
    text-shadow: 0 0 12px rgba(240, 165, 0, .5);
  }
  .hud {
    display: flex;
    justify-content: center;
    gap: 22px;
    margin: 10px 0;
    font-size: 15px;
    flex-wrap: wrap;
  }
  .hud span b { color: var(--gold); }
  .hud span b.hi { color: #4ecdc4; }
  canvas {
    background: #000;
    border: 3px solid #444;
    border-radius: 6px;
    box-shadow: 0 0 30px rgba(233, 69, 96, .25);
    display: block;
    margin: 0 auto;
  }
  .ctrl {
    margin-top: 14px;
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  button {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 10px 22px;
    font-size: 16px;
    border-radius: 6px;
    cursor: pointer;
    letter-spacing: 2px;
    transition: transform .1s, opacity .2s;
  }
  button:hover { transform: translateY(-2px); opacity: .9; }
  button.secondary { background: #2c3e50; }
  .legend {
    margin-top: 14px;
    display: flex;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
    font-size: 13px;
    color: #aab;
  }
  .legend .lg { display: flex; align-items: center; gap: 5px; }
  .legend i.dot {
    width: 12px; height: 12px; border-radius: 3px; display: inline-block;
  }
  .legend i.star { color: #ffd700; font-style: normal; }
  .tip { margin-top: 8px; font-size: 13px; color: #889; }
  .tip kbd {
    background: #2c3e50;
    padding: 2px 7px;
    border-radius: 4px;
    font-family: inherit;
    margin: 0 2px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>坦克大战</h1>
  <div class="hud">
    <span>得分 <b id="score">0</b></span>
    <span>最高分 <b id="highScore" class="hi">0</b></span>
    <span>生命 <b id="lives">3</b></span>
    <span>关卡 <b id="level">1</b>/5</span>
    <span>剩余敌人 <b id="enemies">20</b></span>
  </div>
  <canvas id="game" width="520" height="520"></canvas>
  <div class="ctrl">
    <button id="startBtn">开始游戏</button>
    <button id="pauseBtn" class="secondary">暂停</button>
  </div>
  <div class="legend">
    <span class="lg"><i class="dot" style="background:#e94560"></i>普通 100分</span>
    <span class="lg"><i class="dot" style="background:#f0a500"></i>快速 200分</span>
    <span class="lg"><i class="dot" style="background:#6c5ce7"></i>重型 300分</span>
    <span class="lg"><i class="dot" style="background:#00b894"></i>精英 500分</span>
    <span class="lg"><i class="star">★</i>道具 +500分</span>
  </div>
  <div class="tip">
    移动：<kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 或 方向键 ｜ 射击：<kbd>空格</kbd> / <kbd>J</kbd> ｜ 暂停：<kbd>P</kbd>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const TILE = 40;              // 网格大小
  const COLS = 13, ROWS = 13;   // 13x13 网格
  const TOTAL_LEVELS = 5;       // 总关卡数

  // 地图元素
  const EMPTY = 0, BRICK = 1, STEEL = 2, BASE = 3, WATER = 4;

  // 方向
  const UP = 0, RIGHT = 1, DOWN = 2, LEFT = 3;
  const DX = [0, 1, 0, -1];
  const DY = [-1, 0, 1, 0];

  // —— 敌人类型定义（不同分值 / 血量 / 速度 / 射速）——
  const ENEMY_TYPES = [
    { name: '普通坦克', color: '#e94560', hp: 1, speed: 1.3, points: 100, fireCooldown: 90 },
    { name: '快速坦克', color: '#f0a500', hp: 1, speed: 2.1, points: 200, fireCooldown: 70 },
    { name: '重型坦克', color: '#6c5ce7', hp: 2, speed: 1.0, points: 300, fireCooldown: 120 },
    { name: '精英坦克', color: '#00b894', hp: 2, speed: 1.6, points: 500, fireCooldown: 55 },
  ];

  // —— 关卡难度配置 ——
  function levelConfig(lv) {
    return {
      totalEnemies: 20 + (lv - 1) * 5,        // 20 / 25 / 30 / 35 / 40
      maxOnScreen: Math.min(5, 2 + lv),       // 3 / 4 / 5 / 5 / 5
      brickCount: 30 + lv * 6,
      steelCount: 4 + lv * 3,
      waterCount: 3 + lv,
      clearBonus: 1000 + lv * 500,            // 通关奖励：1500 / 2000 / 2500 / 3000 / 3500
      spawnInterval: Math.max(55, 120 - lv * 12),
    };
  }

  // —— 游戏状态 ——
  let map = [];
  let player = null;
  let enemies = [];
  let bullets = [];
  let particles = [];
  let floaters = [];       // 飘字（得分提示）
  let bonuses = [];        // 道具（加分星星）

  let score = 0;
  let highScore = 0;
  let lives = 3;
  let level = 1;
  let cfg = levelConfig(1);
  let levelEnemiesTotal = cfg.totalEnemies;
  let enemiesSpawned = 0;
  let spawnTimer = 0;

  // 游戏流程状态：ready | playing | cleared | gameover | victory
  let state = 'ready';
  let paused = false;
  let baseAlive = true;
  let levelClearTimer = 0;
  let levelClearBonus = 0;

  // 输入
  const keys = {};
  let shootQueued = false;

  // 读取最高分
  try { highScore = parseInt(localStorage.getItem('tankHighScore')) || 0; } catch (e) {}

  // —— 工具 ——
  function rand(n) { return Math.floor(Math.random() * n); }

  // —— 计分 ——
  function addScore(n) {
    score += n;
    if (score > highScore) {
      highScore = score;
      try { localStorage.setItem('tankHighScore', String(highScore)); } catch (e) {}
    }
    updateHUD();
  }

  function addFloater(x, y, text, color) {
    floaters.push({ x, y, text, color, life: 45 });
  }

  // —— 关卡地图 ——
  function buildMap(lv) {
    map = Array.from({ length: ROWS }, () => Array(COLS).fill(EMPTY));

    // 四周一圈砖墙
    for (let x = 0; x < COLS; x++) { map[0][x] = BRICK; map[ROWS - 1][x] = BRICK; }
    for (let y = 0; y < ROWS; y++) { map[y][0] = BRICK; map[y][COLS - 1] = BRICK; }

    // 基地（老鹰）位于底部中央
    const bx = 6, by = ROWS - 2;
    map[by][bx] = BASE;
    map[by][bx + 1] = BASE;
    map[by - 1][bx] = BRICK;
    map[by - 1][bx + 1] = BRICK;
    map[by - 1][bx - 1] = BRICK;
    map[by - 1][bx + 2] = BRICK;

    // 玩家出生点保持空旷
    const px = 4, py = ROWS - 2;

    const c = levelConfig(lv);
    placeRandom(BRICK, c.brickCount, px, py, bx, by);
    placeRandom(STEEL, c.steelCount, px, py, bx, by);
    placeRandom(WATER, c.waterCount, px, py, bx, by);
  }

  function placeRandom(type, count, px, py, bx, by) {
    let placed = 0, guard = 0;
    while (placed < count && guard < 500) {
      guard++;
      const x = 1 + rand(COLS - 2);
      const y = 1 + rand(ROWS - 2);
      if (map[y][x] !== EMPTY) continue;
      if (Math.abs(x - px) <= 1 && Math.abs(y - py) <= 1) continue;
      if (Math.abs(x - bx) <= 2 && Math.abs(y - by) <= 2) continue;
      if (type === STEEL && Math.random() < 0.3) continue;
      map[y][x] = type;
      placed++;
    }
  }

  // —— 实体 ——
  class Tank {
    constructor(x, y, dir, speed, color, isPlayer) {
      this.x = x; this.y = y;
      this.dir = dir;
      this.speed = speed;
      this.color = color;
      this.isPlayer = isPlayer;
      this.size = 36;
      this.cooldown = 0;
      this.alive = true;
      this.moveTimer = 0;
      this.aiDir = dir;
      this.hp = 1;
      this.fireCooldown = 90;
      this.flash = 0;       // 受击闪烁
      this.points = 100;
    }
    center() {
      return { x: this.x + this.size / 2, y: this.y + this.size / 2 };
    }
  }

  class Bullet {
    constructor(x, y, dir, speed, owner) {
      this.x = x; this.y = y;
      this.dir = dir;
      this.speed = speed;
      this.owner = owner;   // 'player' | 'enemy'
      this.alive = true;
      this.size = 6;
    }
  }

  class Particle {
    constructor(x, y, color) {
      this.x = x; this.y = y;
      this.color = color;
      this.alive = true;
      this.life = 1;
      this.parts = [];
      for (let i = 0; i < 14; i++) {
        this.parts.push({
          dx: (Math.random() - .5) * 120,
          dy: (Math.random() - .5) * 120,
          r: 2 + Math.random() * 4,
          life: .6 + Math.random() * .6
        });
      }
    }
  }

  class Bonus {
    constructor(x, y) {
      this.x = x; this.y = y;
      this.alive = true;
      this.life = 600;      // 约 10 秒后消失
      this.points = 500;
      this.blink = 0;
    }
  }

  // —— 初始化 / 关卡 ——
  function resetGame() {
    score = 0;
    lives = 3;
    level = 1;
    startLevel();
  }

  function startLevel() {
    cfg = levelConfig(level);
    levelEnemiesTotal = cfg.totalEnemies;
    enemiesSpawned = 0;
    buildMap(level);
    baseAlive = true;
    enemies = [];
    bullets = [];
    particles = [];
    floaters = [];
    bonuses = [];
    player = new Tank(4 * TILE + 2, (ROWS - 2) * TILE + 2, UP, 2.8, '#4ecdc4', true);
    spawnTimer = 60;
    updateHUD();
  }

  function spawnEnemy() {
    if (enemiesSpawned >= levelEnemiesTotal) return;
    const spots = [1, 6, 11].map(c => ({ x: c * TILE + 2, y: TILE + 2 }));
    for (const s of spots) {
      if (!enemies.some(e => Math.abs(e.x - s.x) < 20 && Math.abs(e.y - s.y) < 20)) {
        const type = pickEnemyType(level);
        const e = new Tank(s.x, s.y, DOWN, type.speed, type.color, false);
        e.hp = type.hp;
        e.fireCooldown = type.fireCooldown;
        e.points = type.points;
        e.name = type.name;
        e.cooldown = 30;
        enemies.push(e);
        enemiesSpawned++;
        break;
      }
    }
    updateHUD();
  }

  // 根据关卡随机选择敌人类型（越往后越容易出现强敌）
  function pickEnemyType(lv) {
    const pool = [0, 0, 0];
    if (lv >= 1) pool.push(1, 1);
    if (lv >= 2) pool.push(1, 2);
    if (lv >= 3) pool.push(2, 2);
    if (lv >= 4) pool.push(3);
    return ENEMY_TYPES[pool[rand(pool.length)]];
  }

  function spawnBonus() {
    let guard = 0;
    while (guard++ < 100) {
      const x = 1 + rand(COLS - 2), y = 1 + rand(ROWS - 2);
      if (map[y][x] === EMPTY) {
        bonuses.push(new Bonus(x * TILE + TILE / 2, y * TILE + TILE / 2));
        return;
      }
    }
  }

  // —— 输入 ——
  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    keys[k] = true;
    if (k === ' ' || k === 'j') { e.preventDefault(); shootQueued = true; }
    if (k === 'p') togglePause();
    if (k === 'enter' || k === 'r') {
      if (state === 'ready' || state === 'gameover' || state === 'victory') startGame();
    }
  });
  window.addEventListener('keyup', (e) => {
    keys[e.key.toLowerCase()] = false;
  });

  // —— 按钮 ——
  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('pauseBtn').addEventListener('click', togglePause);

  function startGame() {
    resetGame();
    state = 'playing';
    paused = false;
    document.getElementById('startBtn').textContent = '重新开始';
    document.getElementById('pauseBtn').textContent = '暂停';
    updateHUD();
  }

  function togglePause() {
    if (state !== 'playing') return;
    paused = !paused;
    document.getElementById('pauseBtn').textContent = paused ? '继续' : '暂停';
  }

  // —— 更新逻辑 ——
  function update() {
    if (paused) return;

    if (state === 'playing') {
      updatePlaying();
    } else if (state === 'cleared') {
      updateCleared();
    }

    // 粒子、飘字、道具持续更新（即使暂停中不更新）
    updateParticles();
    updateFloaters();
  }

  function updatePlaying() {
    updatePlayer();
    updateEnemies();
    updateBullets();
    updateBonuses();

    // 生成敌人
    if (enemiesSpawned < levelEnemiesTotal && enemies.length < cfg.maxOnScreen) {
      spawnTimer--;
      if (spawnTimer <= 0) {
        spawnEnemy();
        spawnTimer = cfg.spawnInterval;
      }
    }

    // 通关判断：所有敌人已生成且全部被消灭
    if (enemiesSpawned >= levelEnemiesTotal && enemies.length === 0) {
      onLevelCleared();
    }

    updateHUD();
  }

  function updateCleared() {
    levelClearTimer--;
    if (levelClearTimer <= 0) {
      if (level >= TOTAL_LEVELS) {
        state = 'victory';
      } else {
        level++;
        startLevel();
        state = 'playing';
      }
      updateHUD();
    }
  }

  function onLevelCleared() {
    levelClearBonus = cfg.clearBonus;
    addScore(levelClearBonus);
    levelClearTimer = 150;   // 约 2.5 秒过渡
    state = 'cleared';
  }

  function updatePlayer() {
    if (!player.alive) return;

    let dir = null;
    if (keys['w'] || keys['arrowup']) dir = UP;
    else if (keys['s'] || keys['arrowdown']) dir = DOWN;
    else if (keys['a'] || keys['arrowleft']) dir = LEFT;
    else if (keys['d'] || keys['arrowright']) dir = RIGHT;

    if (dir !== null) {
      player.dir = dir;
      moveTank(player, dir, player.speed);
    }

    if (player.cooldown > 0) player.cooldown--;
    if (shootQueued) {
      shoot(player);
      shootQueued = false;
    }
  }

  function updateEnemies() {
    for (const e of enemies) {
      if (!e.alive) continue;
      if (e.flash > 0) e.flash--;
      e.moveTimer--;
      if (e.moveTimer <= 0) {
        e.aiDir = rand(4);
        e.moveTimer = 40 + rand(80);
      }
      e.dir = e.aiDir;
      moveTank(e, e.dir, e.speed);

      if (e.cooldown > 0) e.cooldown--;
      if (e.cooldown === 0 && Math.random() < 0.03) {
        shoot(e);
        e.cooldown = e.fireCooldown + rand(30);
      }
    }
    enemies = enemies.filter(e => e.alive);
  }

  function updateBonuses() {
    if (!player.alive) return;
    const pc = player.center();
    for (const b of bonuses) {
      if (!b.alive) continue;
      b.life--;
      b.blink++;
      if (b.life <= 0) { b.alive = false; continue; }
      if (Math.hypot(pc.x - b.x, pc.y - b.y) < 22) {
        b.alive = false;
        addScore(b.points);
        addFloater(b.x, b.y - 10, '+' + b.points, '#ffd700');
      }
    }
    bonuses = bonuses.filter(b => b.alive);
  }

  function moveTank(t, dir, speed) {
    const steps = Math.max(1, Math.round(speed));
    for (let i = 0; i < steps; i++) {
      const nx = t.x + DX[dir];
      const ny = t.y + DY[dir];
      if (canOccupy(nx, ny, t.size, t)) {
        t.x = nx; t.y = ny;
      } else {
        if (!t.isPlayer) t.moveTimer = 0;
        break;
      }
    }
  }

  function canOccupy(x, y, size, self) {
    const margin = 2;
    const x0 = x + margin, y0 = y + margin;
    const x1 = x + size - margin, y1 = y + size - margin;

    if (x0 < 0 || y0 < 0 || x1 > W || y1 > H) return false;

    const cells = tilesAt(x0, y0, x1, y1);
    for (const c of cells) {
      const t = map[c.y][c.x];
      if (t === BRICK || t === STEEL || t === BASE || t === WATER) return false;
    }

    const tanks = player ? [player, ...enemies] : enemies;
    for (const other of tanks) {
      if (other === self || !other.alive) continue;
      if (rectsOverlap(x0, y0, x1, y1, other.x + 2, other.y + 2, other.x + other.size - 2, other.y + other.size - 2)) {
        return false;
      }
    }
    return true;
  }

  function tilesAt(x0, y0, x1, y1) {
    const set = new Set();
    const c0 = Math.floor(x0 / TILE), c1 = Math.floor((x1 - 1) / TILE);
    const r0 = Math.floor(y0 / TILE), r1 = Math.floor((y1 - 1) / TILE);
    for (let r = r0; r <= r1; r++)
      for (let c = c0; c <= c1; c++)
        set.add(c + ',' + r);
    return [...set].map(s => { const [x, y] = s.split(',').map(Number); return { x, y }; });
  }

  function rectsOverlap(ax0, ay0, ax1, ay1, bx0, by0, bx1, by1) {
    return ax0 < bx1 && ax1 > bx0 && ay0 < by1 && ay1 > by0;
  }

  function shoot(t) {
    if (!t.alive || t.cooldown > 0) return;
    const c = t.center();
    const bullet = new Bullet(c.x - 3, c.y - 3, t.dir, 6, t.isPlayer ? 'player' : 'enemy');
    bullet.x += DX[t.dir] * (t.size / 2 + 2) - 3;
    bullet.y += DY[t.dir] * (t.size / 2 + 2) - 3;
    bullets.push(bullet);
    t.cooldown = t.isPlayer ? 12 : 60;
  }

  function updateBullets() {
    for (const b of bullets) {
      if (!b.alive) continue;
      const steps = Math.max(1, Math.round(b.speed));
      for (let i = 0; i < steps && b.alive; i++) {
        b.x += DX[b.dir];
        b.y += DY[b.dir];
        if (b.x < 0 || b.y < 0 || b.x > W || b.y > H) { b.alive = false; break; }
        handleBulletCollision(b);
      }
    }
    bullets = bullets.filter(b => b.alive);
  }

  function handleBulletCollision(b) {
    const cx = b.x + b.size / 2;
    const cy = b.y + b.size / 2;
    const cellX = Math.floor(cx / TILE);
    const cellY = Math.floor(cy / TILE);

    // 地图碰撞
    if (cellX >= 0 && cellX < COLS && cellY >= 0 && cellY < ROWS) {
      const t = map[cellY][cellX];
      if (t === BRICK) {
        map[cellY][cellX] = EMPTY;
        spawnExplosion(cellX * TILE + TILE / 2, cellY * TILE + TILE / 2, '#b8875b');
        b.alive = false;
        return;
      } else if (t === STEEL) {
        spawnExplosion(cellX * TILE + TILE / 2, cellY * TILE + TILE / 2, '#888');
        b.alive = false;
        return;
      } else if (t === BASE) {
        destroyBase();
        b.alive = false;
        return;
      }
    }

    // 坦克碰撞
    if (b.owner === 'player') {
      for (const e of enemies) {
        if (!e.alive) continue;
        if (pointInRect(cx, cy, e.x, e.y, e.x + e.size, e.y + e.size)) {
          b.alive = false;
          e.hp--;
          if (e.hp <= 0) {
            e.alive = false;
            spawnExplosion(e.x + e.size / 2, e.y + e.size / 2, '#fff');
            addScore(e.points);
            addFloater(e.x + e.size / 2, e.y - 10, '+' + e.points, '#ffd');
            // 一定概率掉落加分道具
            if (Math.random() < 0.18) spawnBonus();
          } else {
            e.flash = 8;
            spawnExplosion(e.x + e.size / 2, e.y + e.size / 2, e.color);
          }
          return;
        }
      }
      // 子弹相互抵消
      for (const other of bullets) {
        if (other !== b && other.owner === 'enemy' && other.alive &&
            Math.abs(other.x - b.x) < 8 && Math.abs(other.y - b.y) < 8) {
          b.alive = false; other.alive = false;
          spawnExplosion(b.x, b.y, '#ffd');
          return;
        }
      }
    } else {
      if (player.alive && pointInRect(cx, cy, player.x, player.y, player.x + player.size, player.y + player.size)) {
        player.alive = false;
        b.alive = false;
        spawnExplosion(player.x + player.size / 2, player.y + player.size / 2, '#4ecdc4');
        loseLife();
        return;
      }
    }
  }

  function pointInRect(px, py, x0, y0, x1, y1) {
    return px >= x0 && px <= x1 && py >= y0 && py <= y1;
  }

  function destroyBase() {
    if (!baseAlive) return;
    baseAlive = false;
    for (let y = 0; y < ROWS; y++)
      for (let x = 0; x < COLS; x++)
        if (map[y][x] === BASE) { map[y][x] = EMPTY; spawnExplosion(x * TILE + 20, y * TILE + 20, '#e94560'); }
    state = 'gameover';
  }

  function loseLife() {
    lives--;
    updateHUD();
    if (lives <= 0) {
      state = 'gameover';
    } else {
      setTimeout(() => {
        if (state === 'playing') {
          player = new Tank(4 * TILE + 2, (ROWS - 2) * TILE + 2, UP, 2.8, '#4ecdc4', true);
        }
      }, 400);
    }
  }

  function spawnExplosion(x, y, color) {
    particles.push(new Particle(x, y, color));
  }

  function updateParticles() {
    for (const p of particles) {
      p.life -= 0.03;
      if (p.life <= 0) p.alive = false;
      for (const pt of p.parts) {
        pt.x += pt.dx * 0.016;
        pt.y += pt.dy * 0.016;
        pt.dx *= 0.94;
        pt.dy *= 0.94;
      }
    }
    particles = particles.filter(p => p.alive);
  }

  function updateFloaters() {
    for (const f of floaters) {
      f.life--;
      f.y -= 0.6;
      if (f.life <= 0) f.alive = false;
    }
    floaters = floaters.filter(f => f.life > 0);
  }

  // —— 渲染 ——
  function draw() {
    ctx.clearRect(0, 0, W, H);

    // 地图
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        const t = map[y][x];
        if (t === EMPTY) continue;
        const px = x * TILE, py = y * TILE;
        if (t === BRICK) drawBrick(px, py);
        else if (t === STEEL) drawSteel(px, py);
        else if (t === BASE) drawBase(px, py);
        else if (t === WATER) drawWater(px, py);
      }
    }

    // 道具
    for (const b of bonuses) {
      if (!b.alive) continue;
      if (b.blink % 40 < 30) drawStar(b.x, b.y);
    }

    // 玩家
    if (player.alive) drawTank(player);

    // 敌人
    for (const e of enemies) if (e.alive) drawTank(e);

    // 子弹
    for (const b of bullets) {
      if (!b.alive) continue;
      ctx.fillStyle = b.owner === 'player' ? '#fff' : '#ffd';
      ctx.beginPath();
      ctx.arc(b.x + b.size / 2, b.y + b.size / 2, b.size / 2, 0, Math.PI * 2);
      ctx.fill();
    }

    // 粒子
    for (const p of particles) {
      for (const pt of p.parts) {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x + pt.x, p.y + pt.y, pt.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;

    // 飘字
    for (const f of floaters) {
      ctx.globalAlpha = Math.min(1, f.life / 20);
      ctx.fillStyle = f.color;
      ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';

    // 覆盖层
    drawStateOverlay();
  }

  function drawStateOverlay() {
    if (state === 'ready') {
      drawOverlay([
        { text: '坦克大战', size: 30, color: '#f0a500' },
        { text: '消灭所有敌人，守护你的基地', size: 16, color: '#ccc' },
        { text: '按「开始游戏」或 Enter 开始', size: 18, color: '#4ecdc4' },
      ]);
    } else if (state === 'cleared') {
      drawOverlay([
        { text: '第 ' + level + ' 关完成！', size: 28, color: '#00b894' },
        { text: '通关奖励 +' + levelClearBonus + ' 分', size: 20, color: '#ffd700' },
      ]);
    } else if (state === 'gameover') {
      const lines = [
        { text: '游戏结束', size: 28, color: '#e94560' },
        { text: '最终得分：' + score, size: 20, color: '#ffd700' },
      ];
      if (score >= highScore && score > 0) {
        lines.push({ text: '🎉 新纪录！', size: 18, color: '#4ecdc4' });
      }
      lines.push({ text: '按 Enter 或「重新开始」再来一局', size: 15, color: '#aaa' });
      drawOverlay(lines);
    } else if (state === 'victory') {
      drawOverlay([
        { text: '🎉 恭喜通关！', size: 30, color: '#00b894' },
        { text: '总分：' + score, size: 22, color: '#ffd700' },
        { text: '最高分：' + highScore, size: 16, color: '#4ecdc4' },
        { text: '按 Enter 再来一局', size: 15, color: '#aaa' },
      ]);
    } else if (paused) {
      drawOverlay([{ text: '已暂停', size: 28, color: '#f0a500' }]);
    }
  }

  function drawOverlay(lines) {
    const totalH = lines.length * 34 + 24;
    const y0 = H / 2 - totalH / 2;
    ctx.fillStyle = 'rgba(0,0,0,0.72)';
    ctx.fillRect(0, y0 - 10, W, totalH + 20);
    ctx.textAlign = 'center';
    lines.forEach((ln, i) => {
      ctx.font = 'bold ' + (ln.size || 24) + 'px sans-serif';
      ctx.fillStyle = ln.color || '#fff';
      ctx.fillText(ln.text, W / 2, y0 + 34 + i * 34);
    });
    ctx.textAlign = 'left';
  }

  function drawStar(x, y) {
    ctx.save();
    ctx.translate(x, y);
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 12;
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI / 2 + i * 2 * Math.PI / 5;
      const a2 = a + Math.PI / 5;
      ctx.lineTo(Math.cos(a) * 13, Math.sin(a) * 13);
      ctx.lineTo(Math.cos(a2) * 5.5, Math.sin(a2) * 5.5);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawBrick(x, y) {
    ctx.fillStyle = '#8a4b2a';
    ctx.fillRect(x, y, TILE, TILE);
    ctx.strokeStyle = '#5c311c';
    ctx.lineWidth = 1;
    for (let row = 0; row < 2; row++) {
      for (let col = 0; col < 2; col++) {
        const bx = x + col * 20, by = y + row * 20;
        ctx.strokeRect(bx + 1, by + 1, 18, 18);
        ctx.beginPath();
        ctx.moveTo(bx, by + 10); ctx.lineTo(bx + 20, by + 10);
        ctx.stroke();
      }
    }
  }

  function drawSteel(x, y) {
    ctx.fillStyle = '#9aa4ae';
    ctx.fillRect(x, y, TILE, TILE);
    ctx.strokeStyle = '#6a747e';
    ctx.lineWidth = 2;
    ctx.strokeRect(x + 2, y + 2, TILE - 4, TILE - 4);
    ctx.beginPath();
    ctx.moveTo(x + 4, y + 4); ctx.lineTo(x + TILE - 4, y + TILE - 4);
    ctx.moveTo(x + TILE - 4, y + 4); ctx.lineTo(x + 4, y + TILE - 4);
    ctx.stroke();
  }

  function drawBase(x, y) {
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(x, y, TILE, TILE);
    ctx.fillStyle = baseAlive ? '#f0a500' : '#555';
    ctx.beginPath();
    ctx.moveTo(x + 6, y + 32);
    ctx.lineTo(x + 20, y + 8);
    ctx.lineTo(x + 34, y + 32);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#e94560';
    ctx.fillRect(x + 17, y + 28, 6, 6);
  }

  function drawWater(x, y) {
    ctx.fillStyle = '#1e6f9f';
    ctx.fillRect(x, y, TILE, TILE);
    ctx.strokeStyle = '#3b9fd4';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x + 6, y + 14); ctx.lineTo(x + 24, y + 14);
    ctx.moveTo(x + 14, y + 24); ctx.lineTo(x + 34, y + 24);
    ctx.stroke();
  }

  function drawTank(t) {
    const { x, y, size } = t;
    ctx.save();
    ctx.translate(x + size / 2, y + size / 2);
    ctx.rotate(t.dir * Math.PI / 2);

    // 履带
    ctx.fillStyle = '#3a3f44';
    ctx.fillRect(-size / 2, -size / 2, size, 7);
    ctx.fillRect(-size / 2, size / 2 - 7, size, 7);
    // 车身
    ctx.fillStyle = t.color;
    ctx.fillRect(-size / 2 + 2, -size / 2 + 8, size - 4, size - 16);
    // 炮塔
    ctx.fillStyle = lighten(t.color);
    ctx.beginPath();
    ctx.arc(0, 0, 9, 0, Math.PI * 2);
    ctx.fill();
    // 炮管
    ctx.fillStyle = '#222';
    ctx.fillRect(-3, -size / 2, 6, 14);

    // 受击闪烁
    if (t.flash > 0) {
      ctx.globalAlpha = 0.6;
      ctx.fillStyle = '#fff';
      ctx.fillRect(-size / 2, -size / 2, size, size);
      ctx.globalAlpha = 1;
    }

    ctx.restore();
  }

  function lighten(hex) {
    const c = hex.replace('#', '');
    const r = Math.min(255, parseInt(c.slice(0, 2), 16) + 40);
    const g = Math.min(255, parseInt(c.slice(2, 4), 16) + 40);
    const b = Math.min(255, parseInt(c.slice(4, 6), 16) + 40);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  function updateHUD() {
    const remaining = (levelEnemiesTotal - enemiesSpawned) + enemies.length;
    document.getElementById('score').textContent = score;
    document.getElementById('highScore').textContent = highScore;
    document.getElementById('lives').textContent = lives;
    document.getElementById('level').textContent = level + '/' + TOTAL_LEVELS;
    document.getElementById('enemies').textContent = remaining;
  }

  // —— 主循环 ——
  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  // 初始渲染
  buildMap(1);
  player = new Tank(4 * TILE + 2, (ROWS - 2) * TILE + 2, UP, 2.8, '#4ecdc4', true);
  updateHUD();
  loop();
})();
</script>
</body>
</html>
